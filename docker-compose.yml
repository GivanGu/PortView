services:
  portview:
    # 优先使用阿里 ACR（国内拉取快）；如需改用 GHCR，注释上一行并取消下一行注释。
    image: crpi-bywv2frq7uqt57e1.cn-hangzhou.personal.cr.aliyuncs.com/selfwarehouse/portview:latest
    # image: ghcr.io/givangu/portview:latest
    container_name: portview
    network_mode: host
    # Logo 自动识别需从容器访问宿主机端口：
    # host 网络下默认用 127.0.0.1（见 PORTVIEW_DISCOVER_HOST）；
    # 若改用 bridge 网络，可设 PORTVIEW_DISCOVER_HOST=host.docker.internal 并依赖此映射。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 唯一持久化点：SQLite 全量数据（密码 / 端口标注 / 监控区间 / 登录态 / 主题）。
      # 备份 = 拷贝 config/portview.db。
      # v1.6.12 起旧 portview-data 命名卷弃用，可 docker volume rm portview-data 清理。
      - ./config:/app/config
    environment:
      - PORTVIEW_PORT=8081  # 可修改此端口以避免冲突
    restart: unless-stopped
