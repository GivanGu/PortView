# PortView 本地构建测试专用（与发布版的 docker-compose.yml 相互独立）
#
# 用法:
#   docker compose -f docker-compose.local.yml up -d --build --force-recreate
#   docker compose -f docker-compose.local.yml logs -f
#
services:
  portview:
    build: .
    image: portview:dev
    container_name: portview
    network_mode: host
    # Logo 自动识别需从容器访问宿主机端口（host 网络下默认 127.0.0.1；
    # bridge 网络可设 PORTVIEW_DISCOVER_HOST=host.docker.internal 并依赖此映射）。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 唯一持久化点：SQLite 全量数据（密码 / 端口标注 / 监控区间 / 登录态 / 主题）。
      # v1.6.12 起旧 portview-data 命名卷弃用。
      - ./config:/app/config
    environment:
      - PORTVIEW_PORT=8081
    restart: unless-stopped
