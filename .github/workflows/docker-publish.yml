name: Docker Build

# 触发：推送到 main 分支（版本号取自 app/__init__.py）。
# 单次构建，同时推送 GHCR + ACR，各打 version + latest 两个 tag。
# 任一 registry 登录/推送失败即整体失败（不再 best-effort）。
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: portview
  GHCR_REGISTRY: ghcr.io
  ACR_REGISTRY: crpi-bywv2frq7uqt57e1.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: selfwarehouse
  ACR_REPO: portview

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from app/__init__.py
        id: ver
        run: |
          VERSION=$(grep -E '__version__' app/__init__.py | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          if [ -z "$VERSION" ]; then
            echo "无法从 app/__init__.py 读取版本号" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "==> 构建版本: ${VERSION}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 单次构建，load 到本地 Docker（产出扁平 manifest，ACR 个人版可接受），
      # 保留 GHA 缓存加速多阶段构建。
      - name: Build image (load to local)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ env.IMAGE_NAME }}:build
          labels: |
            maintainer="${{ github.repository_owner }}"
            org.opencontainers.image.title="PortView"
            org.opencontainers.image.description="Docker 容器与主机端口监控和可视化工具"
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 同一镜像分别打 tag 推送到 GHCR 与 ACR（version + latest）。
      - name: Push to GHCR + ACR
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          GHCR_REF="${GHCR_REGISTRY}/${GITHUB_REPOSITORY,,}"
          ACR_REF="${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPO}"

          echo "==> 推送 GHCR: ${GHCR_REF}"
          docker tag "${IMAGE_NAME}:build" "${GHCR_REF}:${VERSION}"
          docker tag "${IMAGE_NAME}:build" "${GHCR_REF}:latest"
          docker push "${GHCR_REF}:${VERSION}"
          docker push "${GHCR_REF}:latest"

          echo "==> 推送 ACR: ${ACR_REF}"
          docker tag "${IMAGE_NAME}:build" "${ACR_REF}:${VERSION}"
          docker tag "${IMAGE_NAME}:build" "${ACR_REF}:latest"
          docker push "${ACR_REF}:${VERSION}"
          docker push "${ACR_REF}:latest"

          echo "==> 完成：${VERSION} + latest 已推送 GHCR 与 ACR"
