name: Docker Dev Build

# 触发方式：
# 1. push 到 dev 分支（自动构建 dev 镜像）
# 2. 手动 Run workflow
on:
  push:
    branches:
      - "dev"
  workflow_dispatch:
    inputs:
      branch:
        description: "构建指定分支（留空则使用 dev）"
        required: false
        default: "dev"

permissions:
  contents: read

env:
  ACR_REGISTRY: crpi-bywv2frq7uqt57e1.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: selfwarehouse
  ACR_REPO: portview
  IMAGE_TAG: dev

jobs:
  build:
    runs-on: ubuntu-latest
    # 手动触发时允许选择任意分支
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.branch == '' || inputs.branch == 'dev' || inputs.branch == github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.ACR_REPO }}:${{ env.IMAGE_TAG }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.ACR_REPO }}:${{ env.IMAGE_TAG }}-${{ github.sha }}

      - name: Push to ACR
        run: |
          docker push ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.ACR_REPO }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.ACR_REPO }}:${{ env.IMAGE_TAG }}-${{ github.sha }}
