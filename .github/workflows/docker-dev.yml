name: Docker Build (Dev)

# 触发：推送到 dev 分支（开发分支）。
# 构建开发镜像，同时推送 GHCR + ACR，各打 dev + dev-<version> 两个 tag。
# 版本号取自 app/__init__.py（开发前已 bump 为即将发布版本，与合并后 stable 一致）。
# 与 main 的 stable 镜像（version + latest）完全隔离，互不覆盖：
#   - dev            移动标签，永远指向最新 dev 构建
#   - dev-<version>  带版本号，明确「哪个版本的开发版」（如 dev-1.4.9）
on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: portview
  GHCR_REGISTRY: ghcr.io
  ACR_REGISTRY: crpi-bywv2frq7uqt57e1.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: selfwarehouse
  ACR_REPO: portview

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from app/__init__.py
        id: ver
        run: |
          VERSION=$(grep -E '__version__' app/__init__.py | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          if [ -z "$VERSION" ]; then
            echo "无法从 app/__init__.py 读取版本号" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "==> 开发版本: ${VERSION}"

      - name: Compute dev tags
        id: tags
        run: |
          echo "dev_tag=dev" >> "$GITHUB_OUTPUT"
          echo "ver_tag=dev-${{ steps.ver.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "==> 开发镜像 tag: dev + dev-${{ steps.ver.outputs.version }}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 单次构建，load 到本地 Docker（产出扁平 manifest，ACR 个人版可接受），
      # 保留 GHA 缓存加速多阶段构建。
      - name: Build image (load to local)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ env.IMAGE_NAME }}:build
          labels: |
            maintainer="${{ github.repository_owner }}"
            org.opencontainers.image.title="PortView (dev)"
            org.opencontainers.image.description="Docker 容器与主机端口监控和可视化工具（开发版）"
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 同一镜像分别打 tag 推送到 GHCR 与 ACR（dev + dev-<version>）。
      - name: Push to GHCR + ACR
        env:
          DEV_TAG: ${{ steps.tags.outputs.dev_tag }}
          VER_TAG: ${{ steps.tags.outputs.ver_tag }}
        run: |
          set -euo pipefail
          GHCR_REF="${GHCR_REGISTRY}/${GITHUB_REPOSITORY,,}"
          ACR_REF="${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPO}"

          echo "==> 推送 GHCR: ${GHCR_REF}"
          docker tag "${IMAGE_NAME}:build" "${GHCR_REF}:${DEV_TAG}"
          docker tag "${IMAGE_NAME}:build" "${GHCR_REF}:${VER_TAG}"
          docker push "${GHCR_REF}:${DEV_TAG}"
          docker push "${GHCR_REF}:${VER_TAG}"

          echo "==> 推送 ACR: ${ACR_REF}"
          docker tag "${IMAGE_NAME}:build" "${ACR_REF}:${DEV_TAG}"
          docker tag "${IMAGE_NAME}:build" "${ACR_REF}:${VER_TAG}"
          docker push "${ACR_REF}:${DEV_TAG}"
          docker push "${ACR_REF}:${VER_TAG}"

          echo "==> 完成：${DEV_TAG} + ${VER_TAG} 已推送 GHCR 与 ACR"
