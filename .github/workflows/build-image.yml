name: Build Docker Image

# 触发条件：推送到 dagongzai/portview-refactor 分支
# 自动构建 Docker 镜像并同步到 GHCR + ACR
on:
  push:
    branches:
      - "dagongzai/portview-refactor"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # 替换为你的仓库 owner
  OWNER: ${{ github.repository_owner }}
  # ACR 配置 (参考 main 分支 docker-publish.yml)
  ACR_REGISTRY: crpi-bywv2frq7uqt57e1.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: selfwarehouse
  ACR_REPO: portview

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── GHCR 推送 (主要) ──────────────────────────────
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (GHCR)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── ACR 同步 (Best-effort，凭证缺失不影响 GHCR) ──
      - name: Login to Alibaba Cloud ACR
        continue-on-error: true
        id: acr_login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Sync to Alibaba Cloud ACR
        # 使用经典构建器 (DOCKER_BUILDKIT=0) 规避 ACR 对 BuildKit 空 manifest 的拒绝
        if: ${{ steps.acr_login.outcome == 'success' }}
        env:
          DOCKER_BUILDKIT: "0"
        run: |
          set -euo pipefail
          ACR_REF="${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPO}"
          BRANCH="${{ github.ref_name }}"
          # 构建分支镜像
          docker build \
            -t "${ACR_REF}:${BRANCH}" \
            -t "${ACR_REF}:${BRANCH}-latest" \
            -t "${ACR_REF}:sha-${GITHUB_SHA::12}" \
            -f ./Dockerfile .
          docker push "${ACR_REF}:${BRANCH}"
          docker push "${ACR_REF}:${BRANCH}-latest"
          docker push "${ACR_REF}:sha-${GITHUB_SHA::12}"

      - name: Image digest
        run: echo "Image digest: ${{ steps.build.outputs.digest }}"
