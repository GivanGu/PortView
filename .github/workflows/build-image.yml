name: Build Docker Image

# 触发条件：推送到 dagongzai/portview-refactor 分支
# 自动构建 Docker 镜像并同步到 GHCR + ACR
on:
  push:
    branches:
      - "dagongzai/portview-refactor"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  OWNER: ${{ github.repository_owner }}
  ACR_REGISTRY: crpi-bywv2frq7uqt57e1.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: selfwarehouse
  ACR_REPO: portview

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (GHCR)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push to GHCR
        id: build_ghcr
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to Alibaba Cloud ACR
        continue-on-error: true
        id: acr_login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Sync to Alibaba Cloud ACR
        if: always() && steps.acr_login.outcome == 'success'
        env:
          DOCKER_BUILDKIT: "0"
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        run: |
          set -euo pipefail
          ACR_REF="${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.ACR_REPO }}"
          BRANCH="${{ github.ref_name }}"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          # Use classic builder to avoid BuildKit empty manifest issue on ACR
          docker build \
            -t "${ACR_REF}:${BRANCH}" \
            -t "${ACR_REF}:${BRANCH}-latest" \
            -t "${ACR_REF}:sha-${SHORT_SHA}" \
            -f ./Dockerfile .
          docker push "${ACR_REF}:${BRANCH}"
          docker push "${ACR_REF}:${BRANCH}-latest"
          docker push "${ACR_REF}:sha-${SHORT_SHA}"
